[build]
base = "docusaurus"

publish = "build"

command = "yarn run download-docs && yarn build && yarn install"

[context.production.environment]
MEILISEARCH_URL = "https://docs-search.gno.land"
MEILISEARCH_INDEX_UID = "production"
# A search-only key (action: search, index: production) created on the
# Meilisearch host by the infrastructure operators; it can do nothing an
# anonymous visitor cannot already do, which is why it may sit here.
MEILISEARCH_API_KEY = "4768407cf625886d79a670e7adbad23d8f74175562ead7526edf81d9c88cd79c"

[build.environment]
# Environment variables are set here
NODE_VERSION = "20.18"

[[plugins]]
package = "@netlify/plugin-lighthouse"

# Short, stable aliases for the networks page.
#
# Testnets are renamed and replaced every few weeks (test13 -> topaz -> sapphire
# -> pearl -> ...), so any doc, README or tutorial that hardcodes the current
# testnet's hostname rots within a month or two. These aliases give every repo
# outside the monorepo one URL it can link forever; the page behind them is the
# thing that gets updated.

[[redirects]]
  from = "/testnets"
  to = "/resources/gnoland-networks/"
  status = 301

[[redirects]]
  from = "/testnet"
  to = "/resources/gnoland-networks/"
  status = 301

[[redirects]]
  from = "/networks"
  to = "/resources/gnoland-networks/"
  status = 301

# Redirects for builder docs paths that changed in gnolang/gno#5656.
# These old URLs are indexed and linked externally, so they 301 to their
# new homes instead of 404ing. Update or extend when docs paths move again.

# The `to` paths carry a trailing slash because the site canonicalizes to one
# (e.g. /builders/getting-started 301s to /builders/getting-started/); matching
# it here keeps each redirect a single hop instead of chaining two 301s.

# Deleted pages, content folded into other guides.
[[redirects]]
  from = "/builders/anatomy-of-a-gno-package"
  to = "/builders/getting-started/"
  status = 301

[[redirects]]
  from = "/builders/deploy-packages"
  to = "/builders/getting-started/"
  status = 301

[[redirects]]
  from = "/builders/local-dev-with-gnodev"
  to = "/resources/gnodev/"
  status = 301

# Renamed pages.
[[redirects]]
  from = "/builders/what-is-gnolang"
  to = "/builders/what-is-gno/"
  status = 301

[[redirects]]
  from = "/builders/connect-clients-and-apps"
  to = "/builders/rpc-clients/"
  status = 301

[[redirects]]
  from = "/builders/become-a-gnome"
  to = "/builders/contributor-guide/"
  status = 301

[[redirects]]
  from = "/builders/example-minisocial-dapp"
  to = "/builders/tutorial-minisocial/"
  status = 301

